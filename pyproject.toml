[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pespila"
dynamic = ["version"]
description = "Probabilistic soccer match prediction — Dixon-Coles, Bradley-Terry, Elo, and distribution-based models with a scikit-learn compatible API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Michael Wallner" },
]
keywords = [
    "soccer", "football", "prediction", "statistics", "machine-learning",
    "poisson", "dixon-coles", "elo", "bradley-terry", "sports-analytics",
    "betting", "probability", "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "polars>=1.0",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/michaelwallner/PesPila-Parabilis"
Repository = "https://github.com/michaelwallner/PesPila-Parabilis"
Issues = "https://github.com/michaelwallner/PesPila-Parabilis/issues"

[tool.hatch.version]
path = "src/pespila/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["legacy/", "app/", "tests/", "/data/", ".claude/", "*.zip", ".DS_Store", "CLAUDE.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pespila"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N806"]  # Allow uppercase X, X_train etc. (scikit-learn convention)

[tool.ruff.lint.per-file-ignores]
"app/pages/*.py" = ["N999"]  # Streamlit requires numeric-prefixed page names

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
